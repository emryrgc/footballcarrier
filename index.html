<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#08130c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Futbolcu Kariyeri</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E⚽%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
</head>
<body>
  <div id="app">
    <canvas id="c"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-top">
        <div id="hudScore" class="hud-score"></div>
        <div id="hudMin" class="hud-min"></div>
      </div>
      <div id="momentHud" class="hidden">
        <div id="hudLabel" class="hud-label"></div>
        <div class="mini-bars">
          <div id="timeBar" class="mbar time"><i></i></div>
          <div id="stamBar" class="mbar stam"><i></i></div>
        </div>
      </div>
      <div id="ticker" class="hidden">
        <div id="feed"></div>
      </div>
      <div id="banner" class="banner"></div>
      <div id="powerBar" class="power hidden"><i></i></div>
    </div>

    <div id="controls" class="hidden">
      <div id="joyZone">
        <div id="joyBase"><div id="joyKnob"></div></div>
      </div>
      <div class="btns">
        <button id="btnSkill" class="cbtn skill"><span>ÇALIM</span></button>
        <button id="btnPass" class="cbtn pass"><span>PAS</span></button>
        <button id="btnSprint" class="cbtn sprint"><span>KOŞ</span></button>
        <button id="btnShoot" class="cbtn shoot"><span>ŞUT</span></button>
      </div>
    </div>

    <div id="screen" class="page"></div>
    <div id="toast"></div>
    <div id="rotate">Daha iyi deneyim için telefonunu dik tut 📱</div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
